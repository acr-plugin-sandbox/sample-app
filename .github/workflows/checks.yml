name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: no trailing whitespace
        run: |
          if grep -rnI --include='*.kt' --include='*.kts' '[[:space:]]$' .; then
            echo "::error::trailing whitespace found"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: sources are present
        run: test -n "$(find . -name '*.kt' -not -path './.git/*' | head -n 1)"
